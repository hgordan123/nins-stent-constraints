name: Numerical and data-integrity checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python scripts/tests/test_pilot_intake.py
      - run: python scripts/tests/test_contact_geometry.py
      - run: python test_calibration.py
      - run: python -m compileall -q NINSPilot scripts
